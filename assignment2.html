<!doctype html>
<html lang="en">
<head>

        <meta charset="UTF-8">

        <meta name="viewport"
              content="width=device-width, user-scalable=no,
          initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">

        <meta http-equiv="X-UA-Compatible" content="ie=edge">

        <title>Spatial Input Prototype</title>

        <!-- load Tone.js -->
        <script src="https://unpkg.com/tone@14.7.77/build/Tone.js"></script>

        <!-- load spatial controller -->
        <script src="spatialControllerFunctions.js" defer></script>

        <!-- CSS -->
        <link rel="stylesheet" href="style.css">

</head>
<body>
<section>
    <section id="spatialPrototype">
    

        <!-- Animals start here -->
        <div id="animalArea">
            <div class="animal" id="cat" data-sound="audio/cat.mp3">🐱</div>
            <div class="animal" id="frog" data-sound="audio/frog.mp3">🐸</div>
            <div class="animal" id="chick" data-sound="audio/chick.mp3">🐥</div>
            <div class="animal" id="dog" data-sound="audio/dog.mp3">🐶</div>
            <div class="animal" id="cow" data-sound="audio/cow.mp3">🐮</div>
        </div>

        <!-- Music area -->
        <div id="xyPad">

            <!-- Decorative grass -->
            <div class="grass-detail grass-1"></div>
            <div class="grass-detail grass-2"></div>
            <div class="grass-detail grass-3"></div>
            <div class="grass-detail grass-4"></div>

            <div class="flower flower-1"></div>
            <div class="flower flower-2"></div>

            <div class="bush bush-1"></div>
            <div class="bush bush-2"></div>

        </div>

        <!-- Controls -->
        <div id="controls">

            <!-- Redo -->
            <button id="redoButton" aria-label="Redo">
                <img src="image/redo.png" alt="">
            </button>

            <!-- Play / Pause -->
            <button id="playButton" aria-label="Play">
                <img id="playIcon" src="image/play-button.png" alt="">
            </button>

            <!-- Refresh -->
            <button id="refreshButton" aria-label="Refresh">
                <img src="image/refresh.png" alt="">
            </button>

        </div>
    </section>
</body>
</html>
